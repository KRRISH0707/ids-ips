services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idsips}
      POSTGRES_USER: ${POSTGRES_USER:-idsips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idsips} -d ${POSTGRES_DB:-idsips}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:3.8.1
    container_name: idsips-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Disable the security plugin entirely (dev/demo mode)
      # DISABLE_SECURITY_PLUGIN sets plugins.security.disabled internally;
      # do NOT also set plugins.security.disabled – it causes a duplicate-setting crash.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # Required since OpenSearch 2.12.0 – prevents crash-loop even when security is disabled
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-Apex@Sentinel1!}"
      OPENSEARCH_JAVA_OPTS: "-Xms384m -Xmx384m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # ── Application services ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-idsips}:${POSTGRES_PASSWORD:-change-me-in-development}@postgres:5432/${POSTGRES_DB:-idsips}"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_ALERT_TOPIC: "ids.alerts"
      OPENSEARCH_URL: "http://opensearch:9200"
      JWT_SECRET: "${JWT_SECRET:-replace-with-a-long-random-secret}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@ids.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-AdminPassword1!}"
      APP_ENV: "${APP_ENV:-production}"
      IPS_MANAGEMENT_ALLOWLIST: "${IPS_MANAGEMENT_ALLOWLIST:-}"
    ports:
      - "8000:8000"

  detection-engine:
    build:
      context: ./detection-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-idsips}:${POSTGRES_PASSWORD:-change-me-in-development}@postgres:5432/${POSTGRES_DB:-idsips}"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_ALERT_TOPIC: "ids.alerts"
      KAFKA_CONSUMER_GROUP: "detection-engine"
      OPENSEARCH_URL: "http://opensearch:9200"
      OPENSEARCH_INDEX: "ids-alerts"

  ips-controller:
    build:
      context: ./ips-controller
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-idsips}:${POSTGRES_PASSWORD:-change-me-in-development}@postgres:5432/${POSTGRES_DB:-idsips}"
      IPS_SIMULATION_MODE: "${IPS_SIMULATION_MODE:-false}"
      IPS_MANAGEMENT_ALLOWLIST: "${IPS_MANAGEMENT_ALLOWLIST:-}"
    cap_add:
      - NET_ADMIN

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # ── Observability ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # ── Network Sensors & Real Telemetry Ingestion ─────────────────────────────
  suricata:
    image: jasonish/suricata:7.0.6
    container_name: idsips-suricata
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
    command: -i ${SURICATA_INTERFACE:-eth0} -v
    volumes:
      - suricata_logs:/var/log/suricata
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./suricata/rules:/var/lib/suricata/rules
    depends_on:
      kafka:
        condition: service_started

  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: idsips-vector
    restart: unless-stopped
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - suricata_logs:/var/log/suricata:ro
    depends_on:
      kafka:
        condition: service_started
      suricata:
        condition: service_started

networks:
  default:
    name: idsips-net

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
  suricata_logs:
